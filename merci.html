<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merci — Hit-E-Book</title>
<link rel="stylesheet" href="launch.css">
</head>
<body>
<main class="section" style="min-height:100vh;display:grid;place-items:center;text-align:center">
  <div class="container" style="max-width:760px">
    <span class="section-eyebrow">Commande confirmée</span>
    <h1 style="font:500 clamp(42px,7vw,70px) Fraunces,serif;margin-bottom:20px">Merci pour ta commande.</h1>
    <p id="status" style="color:var(--muted);font-size:16px;max-width:600px;margin:0 auto 28px">Nous vérifions ton paiement et préparons ton accès sécurisé…</p>
    <div id="downloads" style="display:grid;gap:12px;max-width:520px;margin:0 auto 24px"></div>
    <p id="hint" style="display:none;color:var(--muted);font-size:13px;max-width:520px;margin:0 auto 24px">Les liens de téléchargement sont temporaires et sécurisés. Si tu viens juste de payer, attends quelques secondes puis réessaie.</p>
    <a class="btn btn-ghost" href="index.html">Retour à Hit-E-Book →</a>
  </div>
</main>
<script>
const ENDPOINT='https://mtjwxqymywachtkavifd.supabase.co/functions/v1/download-ebook-v2';
const labels={'ebook-1':'50 Prompts IA','ebook-2':'Copywriting qui vend','ebook-3':'Créer un ebook en 7 jours'};
const sessionId=new URLSearchParams(location.search).get('session_id');
const statusEl=document.getElementById('status'),downloadsEl=document.getElementById('downloads'),hintEl=document.getElementById('hint');
function button(d){const a=document.createElement('a');a.className='btn btn-primary';a.href=ENDPOINT+'?session_id='+encodeURIComponent(sessionId)+'&ebook_id='+encodeURIComponent(d.ebook_id);a.textContent='Télécharger — '+(d.label||labels[d.ebook_id]||d.ebook_id)+' ↓';a.target='_blank';a.rel='noopener';return a}
async function check(){
 if(!sessionId){statusEl.textContent='Lien de confirmation incomplet. Retourne sur Hit-E-Book et contacte-nous si nécessaire.';return}
 try{
   const r=await fetch(ENDPOINT+'?session_id='+encodeURIComponent(sessionId),{cache:'no-store'});
   const data=await r.json();
   if(r.ok&&data.downloads?.length){downloadsEl.innerHTML='';data.downloads.forEach(d=>downloadsEl.appendChild(button(d)));statusEl.textContent=data.downloads.length>1?'Ton pack est prêt. Tu peux télécharger tes 3 ebooks ci-dessous.':'Ton ebook est prêt. Ton téléchargement sécurisé est disponible ci-dessous.';hintEl.style.display='block';return}
 }catch(e){}
 statusEl.textContent='Paiement reçu. Finalisation de ton accès sécurisé…';
 setTimeout(check,2500);
}
check();
</script>
</body>
</html>
