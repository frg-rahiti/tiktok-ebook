    /* =========================
       VARIABLES
    ========================= */

    let currentLanguage = "fr";
    let currentFilter = "all";


    /* =========================
       AFFICHER LES PRODUITS
    ========================= */

    function renderProducts(filter = "all") {

        const grid = document.getElementById("productsGrid");

        grid.innerHTML = "";

        const filtered = filter === "all"
            ? products
            : products.filter(product => product.category === filter);


        filtered.forEach(product => {

            const data = product[currentLanguage];
            const t = translations[currentLanguage];

            let categoryName;

            if (product.category === "prompts") {
                categoryName = t.categoryPrompts;
            } else if (product.category === "creation") {
                categoryName = t.categoryCreation;
            } else {
                categoryName = t.categoryCopywriting;
            }


            const card = document.createElement("div");

            card.className = "product-card";

            card.innerHTML = `

                <div class="product-image">
                    <img 
                        src="${product.image}" 
                        alt="${data.title}"
                        loading="lazy"
                    >
                </div>

                <div class="product-content">

                    <span class="product-category">
                        ${categoryName}
                    </span>

                    <h3 class="product-title">
                        ${data.title}
                    </h3>

                    <p class="product-desc">
                        ${data.description}
                    </p>

                    <ul class="product-features">

                        ${data.features
                            .map(feature => `<li>${feature}</li>`)
                            .join("")}

                    </ul>

                    <div class="product-price">

                        <span class="price-tag">
                            <span class="currency">€</span>${product.price}
                        </span>

                        <small style="color: #94a3b8;">
                            ${t.once}
                        </small>

                    </div>

                    <a 
                        href="${product.link}" 
                        class="product-cta"
                    >
                        ${t.buy}
                    </a>

                </div>
            `;

            grid.appendChild(card);

        });

    }


    /* =========================
       CHANGER DE LANGUE
    ========================= */

    function changeLanguage(language) {

        currentLanguage = language;

        const t = translations[language];

        // Mise à jour de la langue HTML
        document.documentElement.lang = language;

        // Mise à jour des textes
        document.getElementById("headerDescription").textContent =
            t.headerDescription;

        document.getElementById("heroTitle").textContent =
            t.heroTitle;

        document.getElementById("heroDescription").textContent =
            t.heroDescription;

        document.getElementById("filterAll").textContent =
            t.all;

        document.getElementById("filterPrompts").textContent =
            t.prompts;

        document.getElementById("filterCreation").textContent =
            t.creation;

        document.getElementById("filterCopywriting").textContent =
            t.copywriting;

        document.getElementById("footerQuestion").textContent =
            t.footerQuestion;

        document.getElementById("footerCopyright").textContent =
            t.footerCopyright;


        // Mise à jour du bouton de langue actif
        document.querySelectorAll(".language-btn").forEach(button => {
            button.classList.remove("active");
        });

        event.target.classList.add("active");


        // Réafficher les produits dans la nouvelle langue
        renderProducts(currentFilter);

    }


    /* =========================
       FILTRER LES PRODUITS
    ========================= */

    function filterProducts(category, button) {

        currentFilter = category;

        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        renderProducts(category);

    }


    /* =========================
       INITIALISATION
    ========================= */

    renderProducts();

</script>
